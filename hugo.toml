baseURL = 'https://lolocret.github.io/site/'
languageCode = 'en-us'
title = 'Lolocret'
theme = 'pehtheme-hugo'

summaryLength = '20' # <- 20 words are approximately 160 characters
googleAnalytics = 'G-MEASUREMENT_ID' # <- Your GA-4
disqusShortname = 'your-disqus-shortname' # <- Get form here : https://disqus.com

[params]
	# Meta description, not exceeding 160 characters, used for the meta description within the HTML head
	description = 'Veille créative sur la 3D, le CGI et le character design appliqués à la mode wearable et aux identités visuelles.'
	mainSections = 'posts'
	[params.author]
		name = 'Lorie Crettex'
		bio = 'Veille créative en 3D, CGI, character design et mode wearable'
		avatar = 'images/avatar.png'
		twitter = ''

[pagination]
	pagerSize = 6 # <- Set the desired number of posts per page 

[menu] # Menu management
	[[menu.main]]
		name = 'Accueil'
		pageRef = '/'
		weight = 10
	[[menu.main]]
		name = 'À propos'
		pageRef = '/about'
		weight = 15
	[[menu.main]]
		name = 'Veille'
		pageRef = '/veille'
		weight = 20
	[[menu.main]]
		name = 'Tags'
		pageRef = '/tags'
		weight = 35

[module]
  [module.hugoVersion]
    extended = false
    min = "0.116.0"
  [module.mounts] # Directing the static folder to assets.
  	source = 'assets'
  	target = 'static'

[outputs]
	home = ['HTML', 'JSON']
